name: 'PromptCI Instruction Health Auditor'
description: 'Audit CLAUDE.md, AGENTS.md, and .cursorrules for duplicates, conflicts, and cost bloat in PRs'
author: 'SeriousGeese'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  path:
    description: 'Path to scanned repo'
    required: false
    default: '.'
  fail_on:
    description: >-
      Fail threshold severity (info/warning/high/critical). Honoured in both
      modes: with fail_on_regression enabled it gates the branch in addition to
      the regression check, not instead of it.
    required: false
    default: ''
  fail_on_regression:
    description: 'Fail on PR instruction regressions'
    required: false
    default: 'true'
  base_branch:
    description: 'Base branch to compare against'
    required: false
    default: 'main'
  cli_version:
    description: >-
      Version of @promptci/cli to install. Pinned by default so a release
      cannot change the behaviour of every consumer's pipeline mid-run; set to
      "latest" to always take the newest published CLI.
    required: false
    # Keep in sync with packages/cli/package.json on every release — this is
    # the version the action installs for every consumer.
    default: '0.0.1'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      # Pinned to a full commit SHA. This matters more here than in our own CI:
      # a composite action runs inside every consumer's repository, so a moved
      # tag would propagate to all of them at once. Kept current by the
      # github-actions entry in .github/dependabot.yml, which scans this file
      # as well as .github/workflows.
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22

    - name: Run PromptCI
      shell: bash
      # Inputs reach the script through `env:` instead of being interpolated
      # into it with ${{ }}. A composite action executes in the CALLER's
      # workflow, so `${{ inputs.base_branch }}` spliced directly into a shell
      # line is a script-injection sink: a consumer who wires an
      # attacker-influenced value into it — a fork PR's head ref, say — gets
      # arbitrary commands run on their own runner. Passed via env the value is
      # data and never code.
      #
      # The quoting is load-bearing too. The previous version accumulated
      # arguments into an unquoted `ARGS` string, so any path containing a
      # space was word-split into two broken arguments.
      env:
        PROMPTCI_PATH: ${{ inputs.path }}
        PROMPTCI_FAIL_ON: ${{ inputs.fail_on }}
        PROMPTCI_FAIL_ON_REGRESSION: ${{ inputs.fail_on_regression }}
        PROMPTCI_BASE_BRANCH: ${{ inputs.base_branch }}
        PROMPTCI_CLI_VERSION: ${{ inputs.cli_version }}
      run: |
        set -euo pipefail

        # Pinned by default (cli_version input). An unpinned `npx @promptci/cli`
        # resolves to whatever is newest at the moment each consumer's job runs,
        # so a release could turn a green pipeline red with no change on their
        # side. `--yes` keeps npx from prompting when the version is not cached.
        CLI="@promptci/cli@${PROMPTCI_CLI_VERSION}"

        if [ "$PROMPTCI_FAIL_ON_REGRESSION" = "true" ]; then
          # review-diff compares against origin/<base>. actions/checkout defaults
          # to fetch-depth 1 and fetches only the PR head, so that ref usually
          # does not exist locally: fetch it (the single base ref is enough — the
          # base commit's tree is all the scan needs) and fail with an actionable
          # message rather than the CLI's generic unresolvable-ref error.
          if ! git -C "$PROMPTCI_PATH" rev-parse --git-dir >/dev/null 2>&1; then
            echo "::error::PromptCI review-diff needs a git checkout. Add 'uses: actions/checkout@v5' with 'fetch-depth: 0' before this step."
            exit 1
          fi

          # The remote is hardcoded to `origin`, and the refspec writes the base
          # tip to refs/remotes/origin/<base> so it matches BASE_REF exactly.
          # This is safe because actions/checkout always names its remote
          # `origin` — the action runs after that step, on the checkout it
          # produced. A depth-1 (shallow) checkout is fine too: this fetch pulls
          # the base branch tip, and review-diff needs only that commit's tree
          # (it scans the base and head trees independently — no merge-base), so
          # the shallow boundary never matters. #64 verified both against a
          # depth-1 clone; see packages/cli/tests/review-diff.test.ts.
          BASE_REF="origin/$PROMPTCI_BASE_BRANCH"
          if ! git -C "$PROMPTCI_PATH" rev-parse --verify --quiet "${BASE_REF}^{commit}" >/dev/null; then
            echo "Base ref ${BASE_REF} is not in this checkout; fetching it..."
            git -C "$PROMPTCI_PATH" fetch --no-tags --prune origin \
              "+refs/heads/${PROMPTCI_BASE_BRANCH}:refs/remotes/${BASE_REF}" || true
          fi
          if ! git -C "$PROMPTCI_PATH" rev-parse --verify --quiet "${BASE_REF}^{commit}" >/dev/null; then
            echo "::error::Could not resolve ${BASE_REF}. Check out with history before this step: 'uses: actions/checkout@v5' with 'fetch-depth: 0', and confirm base_branch ('${PROMPTCI_BASE_BRANCH}') names a real branch."
            exit 1
          fi

          echo "Running PromptCI Branch Review (compared to ${BASE_REF})..."
          # fail_on is passed here too. It used to be read only in the scan
          # branch, and since fail_on_regression defaults to 'true', a consumer
          # who set only fail_on had it silently dropped.
          if [ -n "$PROMPTCI_FAIL_ON" ]; then
            npx --yes "$CLI" review-diff \
              --base "$BASE_REF" \
              --path "$PROMPTCI_PATH" \
              --fail-on-regression \
              --fail-on "$PROMPTCI_FAIL_ON"
          else
            npx --yes "$CLI" review-diff \
              --base "$BASE_REF" \
              --path "$PROMPTCI_PATH" \
              --fail-on-regression
          fi
        else
          echo "Running PromptCI Scan..."
          if [ -n "$PROMPTCI_FAIL_ON" ]; then
            npx --yes "$CLI" scan --path "$PROMPTCI_PATH" --fail-on "$PROMPTCI_FAIL_ON"
          else
            npx --yes "$CLI" scan --path "$PROMPTCI_PATH"
          fi
        fi
