name: 'PromptCI Instruction Health Auditor'
description: 'Audit CLAUDE.md, AGENTS.md, and .cursorrules for duplicates, conflicts, and cost bloat in PRs'
author: 'SeriousGeese'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  path:
    description: 'Path to scanned repo'
    required: false
    default: '.'
  fail_on:
    description: 'Fail threshold severity (info/warning/high/critical)'
    required: false
    default: ''
  fail_on_regression:
    description: 'Fail on PR instruction regressions'
    required: false
    default: 'true'
  base_branch:
    description: 'Base branch to compare against'
    required: false
    default: 'main'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      # Pinned to a full commit SHA. This matters more here than in our own CI:
      # a composite action runs inside every consumer's repository, so a moved
      # tag would propagate to all of them at once. Kept current by the
      # github-actions entry in .github/dependabot.yml, which scans this file
      # as well as .github/workflows.
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22

    - name: Run PromptCI
      shell: bash
      # Inputs reach the script through `env:` instead of being interpolated
      # into it with ${{ }}. A composite action executes in the CALLER's
      # workflow, so `${{ inputs.base_branch }}` spliced directly into a shell
      # line is a script-injection sink: a consumer who wires an
      # attacker-influenced value into it — a fork PR's head ref, say — gets
      # arbitrary commands run on their own runner. Passed via env the value is
      # data and never code.
      #
      # The quoting is load-bearing too. The previous version accumulated
      # arguments into an unquoted `ARGS` string, so any path containing a
      # space was word-split into two broken arguments.
      env:
        PROMPTCI_PATH: ${{ inputs.path }}
        PROMPTCI_FAIL_ON: ${{ inputs.fail_on }}
        PROMPTCI_FAIL_ON_REGRESSION: ${{ inputs.fail_on_regression }}
        PROMPTCI_BASE_BRANCH: ${{ inputs.base_branch }}
      run: |
        set -euo pipefail
        if [ "$PROMPTCI_FAIL_ON_REGRESSION" = "true" ]; then
          echo "Running PromptCI Branch Review (compared to origin/$PROMPTCI_BASE_BRANCH)..."
          npx @promptci/cli review-diff \
            --base "origin/$PROMPTCI_BASE_BRANCH" \
            --path "$PROMPTCI_PATH" \
            --fail-on-regression
        else
          echo "Running PromptCI Scan..."
          if [ -n "$PROMPTCI_FAIL_ON" ]; then
            npx @promptci/cli scan --path "$PROMPTCI_PATH" --fail-on "$PROMPTCI_FAIL_ON"
          else
            npx @promptci/cli scan --path "$PROMPTCI_PATH"
          fi
        fi
