# Release-notes generation config: maps the type/changelog labels
# (created by scripts/setup-labels.sh) into sections of auto-generated
# release notes.
changelog:
  exclude:
    labels:
      - chore
      - maintenance
      - duplicate
      - wontfix
  categories:
    - title: ⚠️ Breaking changes
      labels:
        - breaking-change
        - breaking
    - title: 🚀 Features
      labels:
        - feature
        - enhancement
    - title: 🐛 Bug fixes
      labels:
        - bug
        - fix
    - title: 🔍 Detectors & scanner
      labels:
        - detector
        - scanner
    - title: 🔒 Security
      labels:
        - security
    - title: 📚 Documentation
      labels:
        - documentation
        - docs
    - title: 📦 Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - "*"
