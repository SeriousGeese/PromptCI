name: Provenance

# The expiry check for the check provenance records (pcic-kvv3.4). It reads the
# clock, so it lives here and not in `pnpm test`: it must go red when a record
# ages out, but must not break pull requests or the rebuild of an old release.
# Weekly, so the 30-day early warning shows up as annotations on a green run
# long before the 90-day failure.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs, see ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm --filter @promptci/core build

      - name: Check provenance
        run: pnpm provenance:check
