name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # version is read from the packageManager field in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Build before Test. Previously Test ran first, so nothing had built the
      # CLI and cli-e2e.test.ts had to shell out to a build inside beforeAll —
      # which is why a stale `--filter promptci` (dead after the rename to
      # @promptci/cli) went unnoticed: a build failing inside a test's setup is
      # far quieter than a failing Build step.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
