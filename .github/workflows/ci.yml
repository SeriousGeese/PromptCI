name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # For dispatch_ci() in scripts/pr-review.sh: the auto-review bot's branch
  # pushes (base-sync merges, auto-review fixes) are made with GITHUB_TOKEN,
  # which GitHub excludes from push/pull_request triggers — so the bot
  # dispatches CI on the PR head ref explicitly after every push it makes.
  # Without this trigger a bot-pushed SHA would never get CI, and the review
  # pipeline fails closed rather than merging it unverified.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. Without an explicit block the job inherits the repository's
# default token scope, which can be read/write on everything. This workflow
# reads the repo and runs pnpm; statuses:write exists ONLY for the
# dispatched-run commit status below.
permissions:
  contents: read
  statuses: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs. A tag is a mutable pointer —
      # anyone who can push to the action's repository can move `v7` to
      # different code, and every workflow that references it picks that up
      # silently on the next run. A SHA cannot be repointed. The trailing
      # comment carries the human-readable version, and the github-actions
      # entry in .github/dependabot.yml keeps SHA and comment moving together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the job token in .git/config once checkout is done —
          # nothing here pushes, so no later step needs git credentials.
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # version is read from the packageManager field in package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Build before Test. Previously Test ran first, so nothing had built the
      # CLI and cli-e2e.test.ts had to shell out to a build inside beforeAll —
      # which is why a stale `--filter promptci` (dead after the rename to
      # @promptci/cli) went unnoticed: a build failing inside a test's setup is
      # far quieter than a failing Build step.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # @promptci/core is bundled into cli.cjs as a frozen esbuild snapshot
      # (core is a devDependency of cli, not a runtime one), so nothing on
      # npm's side ties the two packages' versions together. Catch drift here
      # rather than at publish time: this is a local, network-free comparison
      # of the two package.json files (see scripts/check-version-sync.mjs).
      - name: Check cli/core version sync
        run: pnpm check-versions

      # Dogfood: run PromptCI's own scanner against this repo and fail on any new
      # instruction-health regression relative to the committed .promptci/baseline.json.
      # Runs after Build so packages/cli/dist/cli.cjs exists (pnpm selfscan invokes it
      # directly rather than downloading a published CLI).
      #
      # The badge check keeps the committed .promptci/health-badge.json honest: the
      # score can move without tripping the ratchet (info-level findings appear or
      # old ones get fixed), so regenerate the badge from the scan's fresh
      # report.json and fail if it differs from what's committed — the fix is
      # running `pnpm selfscan:update` and committing the result.
      - name: Self-scan (instruction health)
        run: |
          pnpm selfscan
          node scripts/health-badge.mjs
          git diff --exit-code -- .promptci/health-badge.json

      # Required-check visibility for DISPATCHED runs (see scripts/pr-review.sh):
      # the auto-review bot's branch pushes use GITHUB_TOKEN, which fires no
      # workflows, so the bot dispatches this workflow explicitly — but a
      # workflow_dispatch run's check run never attaches to any PR's check
      # rollup, and the `main` ruleset's required "ci" check therefore stays
      # unsatisfied even when the run is green. The bot's merge then fails with
      # "base branch policy prohibits the merge" (hit live on PR #78). A legacy
      # commit STATUS with context "ci" DOES attach to the rollup and satisfies
      # the required check, so dispatched runs publish one explicitly — success
      # or failure, so a red dispatched run can never be mistaken for pending.
      # pull_request/push runs skip this: their check run attaches naturally.
      - name: Publish commit status (dispatched runs only)
        if: ${{ github.event_name == 'workflow_dispatch' && always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state=success
          [ "${{ job.status }}" = "success" ] || state=failure
          gh api "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" -f context=ci \
            -f description="dispatched CI run (run_id ${{ github.run_id }})" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Published commit status ci=$state on ${{ github.sha }}"
