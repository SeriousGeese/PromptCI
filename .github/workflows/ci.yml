name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. Without an explicit block the job inherits the repository's
# default token scope, which can be read/write on everything. This workflow
# only reads the repo and runs pnpm.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs. A tag is a mutable pointer —
      # anyone who can push to the action's repository can move `v7` to
      # different code, and every workflow that references it picks that up
      # silently on the next run. A SHA cannot be repointed. The trailing
      # comment carries the human-readable version, and the github-actions
      # entry in .github/dependabot.yml keeps SHA and comment moving together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the job token in .git/config once checkout is done —
          # nothing here pushes, so no later step needs git credentials.
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        # version is read from the packageManager field in package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Build before Test. Previously Test ran first, so nothing had built the
      # CLI and cli-e2e.test.ts had to shell out to a build inside beforeAll —
      # which is why a stale `--filter promptci` (dead after the rename to
      # @promptci/cli) went unnoticed: a build failing inside a test's setup is
      # far quieter than a failing Build step.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
